name: tracking

# Validates project/ on every change to it. Written by the process-kit scaffold.
# Do not change this workflow to make it pass; fix the tracking files.

on:
  pull_request:
    paths: ['project/**', '.github/workflows/tracking.yml']
  push:
    branches: [main]
    paths: ['project/**', '.github/workflows/tracking.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate tracking files and confirm INDEX.md is current
        run: |
          python3 -I project/tools/check.py
          git diff --exit-code -- project/backlog/INDEX.md
